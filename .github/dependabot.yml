version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /patterns/*
      - /patterns/*/openai_version
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major SDK migrations need explicit contract testing and policy updates.
    ignore:
      - dependency-name: openai
        update-types: ['version-update:semver-major']
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

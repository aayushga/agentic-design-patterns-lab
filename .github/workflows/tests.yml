name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
            patterns/*/requirements.txt
      - name: Upgrade installer and install local test dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Run each pattern independently
        run: python scripts/run_pattern_tests.py
      - name: Run credential-free local examples with sockets blocked
        run: python scripts/run_local_examples.py
      - name: Run local MCP examples (Python 3.11+)
        if: matrix.python-version != '3.10'
        run: |
          python patterns/10-model-context-protocol/app.py
          python patterns/10-model-context-protocol/examples/basic_example.py
          python patterns/10-model-context-protocol/examples/advanced_example.py

  sdk-contracts:
    name: OpenAI SDK ${{ matrix.sdk }} offline HTTP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: [minimum, latest-compatible]
        include:
          - sdk: minimum
            requirement: openai==2.32.0
          - sdk: latest-compatible
            requirement: openai>=2.32.0,<3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install real SDK and local protocol dependencies
        env:
          SDK_REQUIREMENT: ${{ matrix.requirement }}
        run: >-
          python -m pip install --only-binary=:all: "$SDK_REQUIREMENT" -r patterns/10-model-context-protocol/requirements.txt -r patterns/15-inter-agent-communication/requirements.txt
      - name: Exercise every adapter without real HTTP connections
        run: python -m pytest tests/sdk -q
